<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暗区突围 - 资源下载站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,sans-serif}
        body{
            background-image:url("bg.webp");
            background-position:center center;
            background-size:cover;
            background-repeat:no-repeat;
            background-attachment:fixed;
            color:#e5e7eb;
            min-height:100vh;
        }
        .overlay{
            width:100%;
            min-height:100vh;
            background:rgba(0,0,0,0.65);
        }
        header{
            background:rgba(29,33,40,0.85);
            padding:18px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid #2c313a;
            position:sticky;top:0;z-index:99
        }
        .logo{font-size:24px;font-weight:bold;color:#ff4444}
        .nav a{color:#cbd5e1;text-decoration:none;margin:0 12px}
        .nav a:hover{color:#ff6666}
        .container{
            max-width:700px;
            margin:60px auto;
            padding:0 20px;
        }
        .card{
            background:rgba(29,33,40,0.9);
            border-radius:16px;
            overflow:hidden;
            border:1px solid #444;
            transition:0.25s ease;
        }
        .card:hover{
            transform:translateY(-6px);
            border-color:#ff4444;
            box-shadow:0 8px 24px rgba(255,68,68,0.25);
        }
        .card-img{
            height:320px;
            background:#272c36;
        }
        .card-img img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .card-body{padding:24px}
        .card h3{margin-bottom:10px;color:#f1f5f9;font-size:24px}
        .info{
            font-size:14px;
            color:#94a3b8;
            line-height:2;
            margin-bottom:20px
        }
        .dl-btn{
            display:block;
            width:100%;
            padding:14px;
            text-align:center;
            background:#dc2626;
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:18px;
            font-weight:500;
            cursor:pointer;
            transition:0.2s
        }
        .dl-btn:hover{background:#b91c1c}
        footer{
            margin-top:80px;
            text-align:center;
            padding:24px;color:#cccccc;font-size:14px
        }
        /* 下载弹窗 */
        .modal{
            display:none;
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            background:rgba(0,0,0,0.8);
            z-index:9999;
            align-items:center;
            justify-content:center;
        }
        .modal-box{
            width:420px;
            background:#1d2128;
            border-radius:14px;
            padding:24px;
            border:1px solid #444;
        }
        .modal h4{margin-bottom:16px;color:#fff}
        .progress-wrap{
            width:100%;
            height:12px;
            background:#2c313a;
            border-radius:6px;
            overflow:hidden;
            margin-bottom:12px
        }
        .progress-bar{
            height:100%;
            width:0%;
            background:#ff4444;
            transition:0.08s linear
        }
        .percent{text-align:right;color:#cbd5e1;margin-bottom:16px}
        .close-btn{
            padding:8px 16px;
            background:#334155;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }
        /* 手机适配 */
        @media(max-width:600px){
            .container{
                margin:30px auto;
            }
            .card-img{
                height:200px;
            }
            .modal-box{
                width:90%;
            }
        }
    </style>
</head>
<body>
<div class="overlay">
    <header>
        <div class="logo">暗区资源站</div>

    </header>

    <div class="container">
        <div class="card">
            <div class="card-img">
                <img src="42.webp" alt="117">
            </div>
            <div class="card-body">
                <h3>暗区突围 - jmcomic3</h3>
                <div class="info">
                    版本：v2.1.6<br>
                    文件大小：29.4 MB<br>
                    更新时间：2026-09-26<br>
                    简介：[漫画软件][不含捆绑包][源自GitHub下载][温馨提示：请合理安排使用时间]
                </div>
                <button class="dl-btn" onclick="startDownload()">立即下载</button>
            </div>
        </div>
    </div>

    <!--下载弹窗-->
    <div class="modal" id="dlModal">
        <div class="modal-box">
            <h4>正在下载 jmcomic3</h4>
            <div class="progress-wrap">
                <div class="progress-bar" id="bar"></div>
            </div>
            <div class="percent" id="pText">0%</div>
            <button class="close-btn" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <footer>
        暗区资源站 © 2026
    </footer>
</div>

<script>
    const modal = document.getElementById('dlModal');
    const bar = document.getElementById('bar');
    const pText = document.getElementById('pText');
    let timer = null;

    function startDownload(){
        modal.style.display = 'flex';
        let progress = 0;
        bar.style.width = '0%';
        pText.innerText = '0%';
        clearInterval(timer);
        timer = setInterval(()=>{
            progress += Math.floor(Math.random()*4)+1;
            if(progress >= 100){
                progress = 100;
                clearInterval(timer);
                pText.innerText = '下载完成 ✔';
                triggerFileDownload();
            }else{
                pText.innerText = progress + '%';
            }
            bar.style.width = progress+'%';
        },80)
    }

    function triggerFileDownload(){
        const link = document.createElement('a');
        link.href = '2026.9.26.apk';
        link.download = '2026.9.26.apk';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function closeModal(){
        modal.style.display = 'none';
        clearInterval(timer);
    }
</script>
</body>
</html>
